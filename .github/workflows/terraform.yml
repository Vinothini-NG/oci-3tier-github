name: OCI Terraform Pipeline

on:
  push:
    branches:
      - main

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Create OCI API Key
        run: |
          cat <<EOF > oci_api_key.pem
          ${{ secrets.OCI_API_PRIVATE_KEY }}
          EOF
          chmod 600 oci_api_key.pem

      - name: Set Terraform Variables
        run: |
          echo "TF_VAR_tenancy_ocid=${{ secrets.OCI_TENANCY_OCID }}" >> $GITHUB_ENV
          echo "TF_VAR_user_ocid=${{ secrets.OCI_USER_OCID }}" >> $GITHUB_ENV
          echo "TF_VAR_fingerprint=${{ secrets.OCI_FINGERPRINT }}" >> $GITHUB_ENV
          echo "TF_VAR_region=${{ secrets.OCI_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_compartment_ocid=${{ secrets.OCI_COMPARTMENT_OCID }}" >> $GITHUB_ENV
          echo "TF_VAR_private_key_path=./oci_api_key.pem" >> $GITHUB_ENV

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="access_key=${{ secrets.OCI_S3_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.OCI_S3_SECRET_KEY }}" \
            -backend-config="bucket=terraform-state" \
            -backend-config="key=oci-3tier/terraform.tfstate" \
            -backend-config="region=ap-sydney-1" \
            -backend-config="endpoints={s3=\"https://sdlvq8nmuuve.compat.objectstorage.ap-sydney-1.oraclecloud.com\"}" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="use_path_style=true"
            -backend-config="disable_chunked_encoding=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan